name: 原型 IPA 构建

# 用途：为 SideStore 安装产出未签名 IPA。
# 与上游的 swift6-quality.yml 分离，不修改、不依赖原有发布流程。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: prototype-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: 构建未签名 IPA
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 显示构建环境
        run: |
          xcodebuild -version
          sw_vers

      - name: 获取 RIME 二进制依赖
        run: bash scripts/ensure_rime_vendor.sh fetch

      - name: 校验依赖完整性
        run: bash scripts/ensure_rime_vendor.sh verify

      - name: 编译主应用与键盘扩展
        run: |
          set -o pipefail
          xcodebuild \
            -project "Universe Keyboard.xcodeproj" \
            -scheme "Universe Keyboard" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_VERSION=6.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: 定位应用产物
        id: locate
        run: |
          APP_PATH="build/Build/Products/${{ inputs.configuration }}-iphoneos/Universe Keyboard.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到应用产物：$APP_PATH"
            find build/Build/Products -maxdepth 2 -name "*.app" -print
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "已找到：$APP_PATH"

      - name: 裁剪主应用内的 RIME 资源副本
        # 主应用与键盘扩展各打包一份 RimeBuiltin，压缩后重复约 22 MB。
        # 主应用运行期不依赖这份资源：唯一入口 RimeConfigManager.prepareDirectories
        # 需要 App Group 容器，而本原型已清空 App Group entitlements，必然失败。
        # 键盘扩展的资源位于 PlugIns/Keyboard.appex/，不受本步骤影响。
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          MANIFEST="Keyboard/RimeBuiltin/RimeBuiltin.manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "未找到 RIME 清单：$MANIFEST"
            exit 1
          fi
          before=$(du -sk "$APP_PATH" | cut -f1)
          removed=0
          # 主应用同步组把 RimeBuiltin 内的文件打平复制到 .app 根目录。
          # 从清单 entries 精确取出文件名（避免误匹配 manifest 内其它 path 字段），
          # 连同清单自身一并删除。
          python3 - "$MANIFEST" > /tmp/rime_names.txt <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          names = [e["path"].split("/")[-1] for e in m["entries"]]
          names.append("RimeBuiltin.manifest.json")
          print("\n".join(names))
          PY
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if [ -e "$APP_PATH/$name" ]; then
              rm -f "$APP_PATH/$name"
              removed=$((removed + 1))
            fi
          done < /tmp/rime_names.txt
          after=$(du -sk "$APP_PATH" | cut -f1)
          echo "已删除主应用 RIME 资源文件数：$removed"
          echo "主应用体积：${before} KB -> ${after} KB"

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          rm -rf Payload AccessibleIME.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AccessibleIME.ipa Payload
          echo "IPA 大小："
          ls -l AccessibleIME.ipa
          echo "包内关键文件："
          unzip -l AccessibleIME.ipa | grep -E 'RimeBuiltin|Keyboard.appex/$' | head -10

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleIME-IPA-${{ inputs.configuration }}
          path: AccessibleIME.ipa
          retention-days: 30
