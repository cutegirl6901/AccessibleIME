name: 原型 IPA 构建

# 用途：为 SideStore 安装产出未签名 IPA。
# 与上游的 swift6-quality.yml 分离，不修改、不依赖原有发布流程。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: prototype-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: 构建未签名 IPA
    runs-on: macos-26
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 显示构建环境
        run: |
          xcodebuild -version
          sw_vers

      - name: 获取 RIME 二进制依赖
        run: bash scripts/ensure_rime_vendor.sh fetch

      - name: 校验依赖完整性
        run: bash scripts/ensure_rime_vendor.sh verify

      - name: 编译主应用与键盘扩展
        run: |
          set -o pipefail
          xcodebuild \
            -project "Universe Keyboard.xcodeproj" \
            -scheme "Universe Keyboard" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_VERSION=6.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: 定位应用产物
        id: locate
        run: |
          APP_PATH="build/Build/Products/${{ inputs.configuration }}-iphoneos/Universe Keyboard.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到应用产物：$APP_PATH"
            find build/Build/Products -maxdepth 2 -name "*.app" -print
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "已找到：$APP_PATH"
          echo "包含的扩展："
          ls -1 "$APP_PATH/PlugIns" 2>/dev/null || echo "（无 PlugIns 目录）"

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          rm -rf Payload AccessibleIME.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AccessibleIME.ipa Payload
          echo "IPA 大小："
          ls -lh AccessibleIME.ipa
          echo "包内结构："
          unzip -l AccessibleIME.ipa | head -30

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleIME-IPA-${{ inputs.configuration }}
          path: AccessibleIME.ipa
          retention-days: 30

      # 自动更新 SideStore 安装源，避免每次手动传输 IPA。
      # 固定标签 prototype-latest，每次构建覆盖其中的 IPA 附件。
      - name: 发布到 SideStore 安装源
        if: inputs.configuration == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="prototype-latest"
          REPO="${{ github.repository }}"

          # 首次运行时创建固定标签的发布版本。
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "无障碍拼音原型（最新）" \
              --notes "SideStore 安装源。每次发布自动更新。"
          fi

          # 覆盖旧附件；失败时先删除同名附件再上传。
          gh release upload "$TAG" AccessibleIME.ipa --repo "$REPO" --clobber

          echo "安装地址："
          echo "https://github.com/$REPO/releases/download/$TAG/AccessibleIME.ipa"
